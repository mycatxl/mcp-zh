#:schema node_modules/wrangler/config-schema.json
name = "mcp-zh-registry"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Local `wrangler dev` works with this placeholder because Miniflare keeps its
# own SQLite file under .wrangler/state. Replace it with the real id printed by
# `wrangler d1 create mcp-zh` before running `wrangler deploy`.
[[d1_databases]]
binding = "DB"
database_name = "mcp-zh"
database_id = "fe25617e-f6fd-413a-9ff9-d49688011cf5"

[observability]
enabled = true
