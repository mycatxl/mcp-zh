#:schema node_modules/wrangler/config-schema.json
name = "mcp-zh"
main = "src/index.js"
compatibility_date = "2025-06-01"

# scripts/deploy.mjs fills this in: it looks the database up by name,
# creates it when missing, and writes the real id back here. The placeholder
# keeps `wrangler dev --local` working, because Miniflare keeps its own
# SQLite file under .wrangler/state and ignores the id.
[[d1_databases]]
binding = "DB"
database_name = "mcp-zh"
database_id = "00000000-0000-0000-0000-000000000000"

[observability]
enabled = true
