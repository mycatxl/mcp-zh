# Fully automated refresh AND publish of the MCP 中文源 (mcp-zh).
#
# What runs: re-crawl the official registry, re-translate only what is new, verify
# everything, then import into D1 and redeploy the Worker — but ONLY when the
# served content actually changed.
#
# WHY THE CHANGE DETECTION EXISTS
# A full import writes ~68,600 rows, which is ~69% of D1's free daily write budget.
# Importing every day "just in case" would consume the quota for no benefit and
# leave nothing to retry with after a failure. generator/step3-sql.js therefore
# emits a contentHash over exactly what the market sees; if it matches the hash
# already published, this job stops before touching D1.
#
# WHY THE REFRESH DOES NOT RUN ON CLOUDFLARE
# Workers Cron Triggers are limited to 10 ms of CPU per invocation on the free
# plan, and crawling the registry takes about 19 minutes. The scheduled side has
# to run where long jobs are allowed, so GitHub Actions does the refresh and
# Cloudflare does the serving.
#
# WHERE THE DEPLOYED URL LIVES
# scripts/deploy.mjs writes the real endpoint back into project.json after a
# successful deploy, and this workflow reads it from there. Moving to another
# Cloudflare account changes the *.workers.dev subdomain, and that is handled
# without editing any file by hand.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions)
#   CLOUDFLARE_API_TOKEN   from dash.cloudflare.com/profile/api-tokens,
#                          using the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown in the dashboard URL
# Without them the verify steps still run and the publish steps are skipped, so a
# fork or a fresh clone does not fail.
#
# DOWNTIME: applying the schema drops and recreates both tables. Measured import
# time is ~6 seconds, and the import is a single transaction that rolls back on
# failure, so the exposure is small and a failed run is safe to retry.

name: refresh

on:
  schedule:
    # 03:17 UTC daily — off the hour, to avoid the busiest window.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Import into D1 even if the content hash is unchanged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never let two refreshes overlap: both would try to drop and recreate the same
  # tables, and the daily write budget only covers one full import.
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The translation cache is the expensive artefact: ~6 minutes of calls to a
      # free endpoint, and re-translating 60k strings daily would be rude to it.
      # Carried between runs by cache rather than committed, to keep git history
      # small. Keyed on the run id so each run saves a fresh copy, with
      # restore-keys falling back to the most recent one.
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: data/translation-cache.json
          key: translation-cache-${{ github.run_id }}
          restore-keys: |
            translation-cache-

      # A full re-crawl is the default and is FASTER than the server-side delta:
      # `?updated_since=` works but paginating it took over 60 s per page in
      # testing, versus ~0.15 s unfiltered. See generator/update.js.
      - name: Fetch the registry (~19 min)
        run: node generator/update.js

      # Which words from a registry name are ordinary vocabulary rather than a
      # brand is decided from the corpus, so this has to run after the fetch and
      # before the translation. The generated file is committed as well, so a
      # fresh clone or a one-click deploy builds without needing the crawl.
      - name: Rebuild the corpus word statistics
        run: node generator/build-word-stats.js

      - name: Translate and regenerate the import file
        run: node generator/step3-sql.js

      - name: Verify against a real SQLite engine
        run: node generator/step4-verify.js

      - name: Check the id scheme against the client's own derivation
        run: node generator/check-id-collision.js

      - name: Check every record is visible to the client
        run: node generator/check-served.js

      # The host's acceptance rules are part of the protocol being mirrored, so a
      # regression here means the mirror is broken, not the data.
      - name: Check the extracted host mapper still behaves
        run: node test/host-mapper.js

      - name: Check masking and brand detection
        run: node test/translate-mask.js

      - name: Check source ordering rules
        run: node test/source-order.js

      - name: Check the deploy script's parsing
        run: node test/deploy-parse.js

      - name: Check D1 limits before uploading
        run: node test/limits.js

      # ---- publish ---------------------------------------------------------
      - name: Read the published hash
        id: published
        env:
          # Needed to query D1. Without it the script reports "no hash", which
          # makes the next step treat this as a first publish — the safe way to
          # be wrong.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Asked straight from D1, not from /health. /health needs the deployed
          # URL, which lives in project.json — and the one-click deploy writes
          # that file inside Cloudflare's build checkout, which is never pushed
          # back here. So on the deployment flow this project recommends, the
          # URL stays null, no hash is ever read, and every run re-imports
          # identical data for ~69% of the daily write budget.
          HASH=$(node scripts/published-hash.mjs)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "published hash: ${HASH:-（none — first publish）}"

      - name: Decide whether to publish
        id: decide
        run: |
          NEW=$(node -p 'require("./data/stats.json").contentHash')
          OLD="${{ steps.published.outputs.hash }}"
          FORCE="${{ github.event.inputs.force_publish }}"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ] && [ "$FORCE" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "content unchanged ($NEW) — skipping the D1 import"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "content changed: ${OLD:-（none）} -> $NEW"
          fi

      # What makes the Deploy to Cloudflare button work: Cloudflare clones this
      # repository and runs its build step in a fresh checkout that has no data/
      # directory and no translation cache, so that step downloads this instead
      # of trying to regenerate it. Published BEFORE the D1 import so that a
      # failed import still leaves a good dataset available to every other
      # clone, fork and one-click deploy.
      - name: Publish the dataset as a release asset
        if: steps.decide.outputs.publish == 'true'
        env:
          # GITHUB_TOKEN is provided automatically; the `permissions: contents:
          # write` block above is what allows it to create the release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-seed.mjs

      - name: Import into D1 and redeploy
        if: steps.decide.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping the publish step."
            echo "Add it under Settings -> Secrets and variables -> Actions to enable auto-publish."
            exit 0
          fi
          node scripts/deploy.mjs

      - name: Summarise
        run: |
          {
            echo "### refresh result"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| content hash | \`${{ steps.decide.outputs.new }}\` |"
            echo "| previous | \`${{ steps.published.outputs.hash || '（none）' }}\` |"
            echo "| published | ${{ steps.decide.outputs.publish }} |"
            echo ""
            node scripts/summary.mjs
          } >> "$GITHUB_STEP_SUMMARY"

      # Only the small summary is committed: it is the reviewable record of what
      # the dataset looks like now. Everything large is reproducible from the
      # cache plus step3, so it stays out of git.
      - name: Commit the summary
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f data/stats.json
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            # NO SKIP MARKER HERE, deliberately. It is what tells Cloudflare
            # Workers Builds that the dataset moved, and Workers Builds honours
            # the skip markers (`[skip ci]`, `[CI Skip]`, `[skip actions]`, …).
            # Adding one back stops the rebuild, and the fresh dataset then sits
            # in the release while the live database keeps serving the old one —
            # silently, with a green workflow every night.
            #
            # Cloudflare scans the WHOLE commit message, body included. A commit
            # that merely mentions the marker skips its own build — this was
            # observed, not assumed: a message explaining this very rule came
            # back with the build "skipped".
            #
            # It was never needed to stop this workflow re-triggering itself:
            # GitHub does not start workflow runs for pushes made with the
            # built-in GITHUB_TOKEN, which is what the `git push` below uses.
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
